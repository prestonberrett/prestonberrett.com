name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run on the same branch or PR when a newer commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      # Deploy only from main, never from PRs. Needs repo secrets
      # CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit permission) and CLOUDFLARE_ACCOUNT_ID.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: prestonberrett
        run: |
          # Create the Pages project on the first deploy
          if ! pnpm dlx wrangler@4 pages project list | grep -qw "$PROJECT"; then
            pnpm dlx wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi
          pnpm dlx wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA"
